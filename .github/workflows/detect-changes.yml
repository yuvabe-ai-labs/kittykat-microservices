name: Detect Microservices Changes

on:
  push:
    branches:
      - '**'   # Trigger on all branches
    paths:
      - '**/*' # Monitor changes in all files

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Handle merge base commits and detect Dockerfile changes
        id: detect-changes
        run: |
          # Check if it's a merge commit
          if [[ $(git show --summary | grep 'Merge:') != "" ]]; then
              last_changes=$(git show --summary | grep Merge: | xargs | awk '{print($3".."$2)}')
              echo "Setting output for last merged commits ${last_changes}"
              files_changed=$(git diff --no-commit-id --name-only -r ${last_changes} | xargs)
          else
              # Handle direct or stashed commits
              commit_id=$(git rev-parse HEAD)
              echo "Setting output for last non-merged commit ${commit_id}"
              files_changed=$(git diff-tree --no-commit-id --name-only -r ${commit_id} | xargs)
          fi
          
          # Print all changed files for debugging
          echo "Changed files: ${files_changed}"

          # Initialize arrays
          all_changes=($files_changed)

          # Debugging output
          if [ ${#all_changes[@]} -eq 0 ]; then
            echo "No changes detected!"
          fi

          # Check if 'restart_all_services' was modified and update the list of changes
          for i in "${all_changes[@]}"; do
              if [[ $i == *"restart_all_services"* ]]; then
                  data_sources=(data_sources/*/Dockerfile)
                  analytics=(analytics/*/Dockerfile)
                  common_services=(common_services/*/Dockerfile)
                  all_changes=("${data_sources[@]}" "${analytics[@]}" "${common_services[@]}")
                  break
              fi
          done

          # Initialize parent folders array
          parent_folders=()

          # Check if any of the directories contain a Dockerfile and are not ignored
          for i in "${all_changes[@]}"; do
              splits=(${i//\// })
              service_folder="${splits[0]}/${splits[1]}"
              dockerfile_location="$service_folder/Dockerfile"
              ignore_file_location="$service_folder/.cicd_ignore"
              
              # Handle specific folders (data_sources, analytics, common_services)
              if [[ "${splits[0]}" == "data_sources" || "${splits[0]}" == "analytics" || "${splits[0]}" == "common_services" ]]; then 
                  if [ ! -f $dockerfile_location ]; then
                      echo "Dockerfile not found for $service_folder!"
                  elif [ -f $ignore_file_location ]; then
                      echo "Ignoring the service - $service_folder"
                  else
                      parent_folders+=($service_folder)
                  fi
              fi
          done

          # Remove duplicates from the parent_folders array
          parent_folders=($(printf "%s\n" "${parent_folders[@]}" | sort -u))
          echo "Parent folders to be deployed: ${parent_folders[@]}"

          # Format the final output for the matrix
          path=$(printf ",\"%s\"" "${parent_folders[@]}")
          path=${path:1}
          echo "Final path: ${path}"

          # Set output using environment files instead of set-output (deprecation warning fix)
          echo "matrix={\"path\": [ $path ] }" >> $GITHUB_ENV
          
      - name: Display changed microservices
        run: |
          echo "The following microservices have been changed: ${{ env.matrix }}"
