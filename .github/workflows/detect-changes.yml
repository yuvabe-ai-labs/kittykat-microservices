name: Display Changed Folders

on:
  push:
    branches:
      - '**'   # Trigger on all branches
    paths:
      - '**/*' # Monitor changes in all files

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Handle merge base commits and display folders
        id: detect-changes
        run: |
          # Check if it's a merge commit
          if [[ $(git show --summary | grep 'Merge:') != "" ]]; then
              last_changes=$(git show --summary | grep Merge: | xargs | awk '{print($3".."$2)}')
              echo "Setting output for last merged commits ${last_changes}"
              files_changed=$(git diff --no-commit-id --name-only -r ${last_changes} | xargs)
          else
              # Handle direct or stashed commits
              commit_id=$(git rev-parse HEAD)
              echo "Setting output for last non-merged commit ${commit_id}"
              files_changed=$(git diff-tree --no-commit-id --name-only -r ${commit_id} | xargs)
          fi
          
          # Print all changed files for debugging
          echo "Changed files: ${files_changed}"

          # Initialize an array to store parent folders
          parent_folders=()

          # Loop through each changed file and extract the parent folder
          for i in ${files_changed[@]}; do
              # Extract the folder path by getting everything before the first file name
              parent_folder=$(dirname $i)
              # Add the parent folder to the list
              parent_folders+=($parent_folder)
          done

          # Remove duplicates and sort the folder list
          parent_folders=($(printf "%s\n" "${parent_folders[@]}" | sort -u))

          # Print all unique parent folders
          echo "Changed folders: ${parent_folders[@]}"

          # Format the final output for the matrix
          path=$(printf ",\"%s\"" "${parent_folders[@]}")
          path=${path:1}
          echo "Final path: ${path}"

          # Set output using environment files for GitHub Actions
          echo "matrix={\"path\": [ $path ] }" >> $GITHUB_ENV

      - name: Display changed folders
        run: |
          echo "The following folders have been changed: ${{ env.matrix }}"
